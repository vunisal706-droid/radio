<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VicRadio</title>
<meta name="description" content="Radio en directo: Radio Marca, Cadena SER Granada, COPE Granada, Canal Sur Radio y Onda Cero.">
<meta name="theme-color" content="#2f6bff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VicRadio">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#f4f7fc; --card:#ffffff; --ink:#0f1b33; --muted:#6b7893;
    --line:#e6ecf7; --accent:#2f6bff; --accent2:#7a3cff; --ok:#1fae5a;
    --warn:#d97706; --err:#dc2626;
    --shadow:0 10px 30px rgba(21,44,84,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .wrap{max-width:520px; margin:0 auto; padding:22px 18px 200px}
  header{display:flex; align-items:center; gap:12px; margin:8px 2px 22px}
  header .logo{width:44px;height:44px;border-radius:13px;box-shadow:var(--shadow)}
  header h1{font-size:20px; margin:0; letter-spacing:.2px}
  header p{margin:2px 0 0; font-size:13px; color:var(--muted)}

  .list{display:flex; flex-direction:column; gap:14px}
  .station{
    display:flex; align-items:center; gap:15px;
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:15px 16px; box-shadow:var(--shadow); cursor:pointer;
    transition:transform .12s ease, border-color .2s ease;
  }
  .station:active{transform:scale(.985)}
  .station.active{border-color:var(--accent)}
  .station:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
  .badge{
    width:52px;height:52px;border-radius:14px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-weight:800;font-size:15px;letter-spacing:.3px;
  }
  .meta{flex:1;min-width:0}
  .meta h2{margin:0;font-size:16px;line-height:1.2}
  .meta span{display:block;margin-top:3px;font-size:12.5px;color:var(--muted)}
  .eq{display:flex;align-items:flex-end;gap:3px;height:22px;width:24px;flex:0 0 auto;opacity:0}
  .station.active .eq{opacity:1}
  .eq i{width:4px;background:var(--accent);border-radius:2px;height:6px;animation:bounce 1s infinite ease-in-out}
  .eq i:nth-child(2){animation-delay:.2s}
  .eq i:nth-child(3){animation-delay:.4s}
  .eq i:nth-child(4){animation-delay:.15s}
  .station.active.paused .eq i{animation-play-state:paused}
  @keyframes bounce{0%,100%{height:6px}50%{height:20px}}

  /* Reproductor fijo */
  .player{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:rgba(255,255,255,.94); backdrop-filter:saturate(1.4) blur(14px);
    border-top:1px solid var(--line); box-shadow:0 -8px 30px rgba(21,44,84,.10);
    padding:14px 18px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(120%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .player.show{transform:translateY(0)}
  .player-inner{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .p-badge{width:50px;height:50px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
  .p-meta{flex:1;min-width:0}
  .p-meta h3{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-meta span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .dot.live{background:var(--ok)}
  .dot.wait{background:var(--warn)}
  .dot.bad{background:var(--err)}
  .play-btn{
    width:56px;height:56px;flex:0 0 auto;border:none;border-radius:50%;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(47,107,255,.4);
    transition:transform .12s ease}
  .play-btn:active{transform:scale(.94)}
  .play-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .play-btn svg{width:24px;height:24px;fill:#fff}
  .vol{display:flex;align-items:center;gap:8px;margin:12px auto 0;max-width:520px}
  .vol svg{width:18px;height:18px;fill:var(--muted);flex:0 0 auto}
  .vol input{flex:1;accent-color:var(--accent)}

  .install{
    display:none;align-items:center;gap:10px;justify-content:center;
    margin:20px 2px 0;padding:12px;border:1px dashed var(--accent);border-radius:14px;
    background:#eef3ff;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
  .install.show{display:flex}
  .hint{margin:26px 4px 0;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="icon-192.png" alt="VicRadio" width="44" height="44">
    <div>
      <h1>VicRadio</h1>
      <p>Tus emisoras en directo</p>
    </div>
  </header>

  <div class="list" id="list"></div>

  <button class="install" id="installBtn">Instalar app en el móvil</button>

  <p class="hint" id="hint"></p>
</div>

<div class="player" id="player">
  <div class="player-inner">
    <div class="p-badge" id="pBadge">--</div>
    <div class="p-meta">
      <h3 id="pName">—</h3>
      <span><i class="dot" id="pDot"></i><span id="pState">Toca una emisora</span></span>
    </div>
    <button class="play-btn" id="playBtn" aria-label="Reproducir o pausar">
      <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>
  <div class="vol">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <label for="vol" class="sr-only" style="position:absolute;left:-9999px">Volumen</label>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9">
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
/* ---------------------------------------------------------------
   Cada emisora tiene VARIAS urls. Si una falla, se prueba la
   siguiente automáticamente. Pon primero la que mejor te funcione.
----------------------------------------------------------------*/
const STATIONS = [
  { id:'marca', name:'Radio Marca', tag:'Deportes · Nacional', color:'#e2001a', abbr:'RM',
    urls:[
      'https://playerservices.streamtheworld.com/api/livestream-redirect/RADIOMARCA_NACIONAL.mp3',
      'https://25603.live.streamtheworld.com/RADIOMARCA_NACIONAL.mp3',
      'https://playerservices.streamtheworld.com/api/livestream-redirect/RADIOMARCA_NACIONALAAC.aac'
    ]},
  { id:'ser', name:'Cadena SER Granada', tag:'102.5 FM · Granada', color:'#0a7d34', abbr:'SER',
    urls:[
      'https://playerservices.streamtheworld.com/api/livestream-redirect/SER_ASO_GRANADA.mp3',
      'https://playerservices.streamtheworld.com/api/livestream-redirect/SER_ASO_GRANADAAAC.aac',
      'https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3'
    ]},
  { id:'cope', name:'COPE Granada', tag:'99.8 FM · Granada', color:'#0a4aa0', abbr:'COPE',
    urls:[
      'https://wecast-bl01.flumotion.com/copesedes/granada.mp3',
      'https://wecast-bl01.flumotion.com/copesedes/granada-low.mp3',
      'https://granada-copesedes-rrcast.flumotion.com/copesedes/granada-low.mp3',
      'https://wecast-bl02.flumotion.com/copesedes/granada.mp3',
      'https://wecast-b02-01.flumotion.com/copesedes/granada.mp3',
      'https://wecast-b02-02.flumotion.com/copesedes/granada.mp3',
      'https://flucast13-h-cloud.flumotion.com/cope/net1.mp3'
    ]},
  { id:'canalsur', name:'Canal Sur Radio', tag:'Andalucía · en directo', color:'#1a9b8a', abbr:'CSR',
    urls:[
      'https://rtva-live-radio.flumotion.com/rtva/csr.mp3',
      'https://cdnlive.shooowit.net/rtvalive/channel01.isml/index.m3u8'
    ]},
  { id:'canalsurgr', name:'Canal Sur Radio Granada', tag:'Andalucía · Granada', color:'#12857a', abbr:'CSG',
    urls:[
      'https://rtva-live-radio.flumotion.com/rtva/csrgra.mp3'
    ]},
  { id:'ondacero', name:'Onda Cero', tag:'Nacional · en directo', color:'#ff7a00', abbr:'OC',
    urls:[
      'https://radio-atres-live.ondacero.es/api/livestream-redirect/OCAAC.aac',
      'https://atres-live.ondacero.es/api/livestream-redirect/OCRAAC.aac',
      'https://icecast-streaming.nice264.com/ondacero'
    ]}
];

const audio   = document.getElementById('audio');
const listEl  = document.getElementById('list');
const player  = document.getElementById('player');
const pName   = document.getElementById('pName');
const pState  = document.getElementById('pState');
const pDot    = document.getElementById('pDot');
const pBadge  = document.getElementById('pBadge');
const playBtn = document.getElementById('playBtn');
const playIcon= document.getElementById('playIcon');
const volEl   = document.getElementById('vol');

const ICON_PLAY  = 'M8 5v14l11-7z';
const ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
const ICON_LOAD  = 'M12 4V2A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8z';

const KEEPALIVE  = true;   // pon false si notas cualquier rareza con la notificación
const STALL_MS   = 15000;  // sin avanzar el audio -> recuperar
const RESUME_MS  = 6000;   // pausado sin querer -> reanudar

let current    = null;   // emisora seleccionada
let urlIdx     = 0;      // fuente en uso
let wantPlay   = false;  // el usuario quiere oír la radio
let userPaused = false;  // la pausa la ha pedido el usuario
let attempt    = 0;      // reconexiones completas consecutivas
let retryTimer = null;
let lastTime   = -1;     // último currentTime visto
let lastMoveAt = 0;      // instante real en que el audio avanzó por última vez

/* ---------------------------------------------------------------
   KEEPALIVE — la clave para el segundo plano en Android.
   Un audio SILENCIOSO en bucle mantiene la pestaña clasificada como
   "reproduciendo audio" aunque el stream se caiga. Así Android no
   estrangula los temporizadores ni degrada el proceso, y el vigilante
   puede reconectar con la pantalla apagada.
----------------------------------------------------------------*/
let keepEl = null;

function silentWavUrl(seconds){
  const rate = 8000, n = rate * seconds, bytes = 44 + n * 2;
  const buf = new ArrayBuffer(bytes), v = new DataView(buf);
  const str = (o, s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  str(0,'RIFF'); v.setUint32(4, bytes-8, true); str(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,'data'); v.setUint32(40, n*2, true);   // muestras a cero = silencio
  return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
}

function startKeepAlive(){
  if(!KEEPALIVE) return;
  if(!keepEl){
    keepEl = new Audio(silentWavUrl(5));
    keepEl.loop = true;
    keepEl.volume = 1;          // el contenido ya es silencio: inaudible,
    keepEl.preload = 'auto';    // pero cuenta como reproducción para Android
  }
  keepEl.play().catch(()=>{});
}
function stopKeepAlive(){ if(keepEl){ keepEl.pause(); } }

/* ---------- construcción de la lista ---------- */
STATIONS.forEach(s => {
  const el = document.createElement('div');
  el.className = 'station';
  el.dataset.id = s.id;
  el.tabIndex = 0;
  el.setAttribute('role','button');
  el.innerHTML = `
    <div class="badge" style="background:linear-gradient(135deg, ${s.color}, ${shade(s.color)})">${s.abbr}</div>
    <div class="meta"><h2>${s.name}</h2><span>${s.tag}</span></div>
    <div class="eq"><i></i><i></i><i></i><i></i></div>`;
  el.addEventListener('click', () => select(s));
  el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(s); }});
  listEl.appendChild(el);
});

/* ---------- emisoras.json: lo actualiza GitHub Actions cada mañana ----------
   Pone primero las direcciones que hoy funcionan y añade las nuevas que encuentre.
   Si no se puede leer, se usan las de arriba tal cual. */
fetch('emisoras.json?_=' + Date.now(), {cache:'no-store'})
  .then(r => r.ok ? r.json() : null)
  .then(j => {
    if(!j || !j.emisoras) return;
    STATIONS.forEach(s => {
      const e = j.emisoras[s.id]; if(!e || !Array.isArray(e.urls)) return;
      // Primero las tuyas que hoy funcionan, luego el resto de las tuyas
      // y al final las de reserva (solo si todas las tuyas fallan).
      const nuevas = [...(e.ok || []), ...s.urls, ...(e.reserva || [])].filter((u, i, a) => u && a.indexOf(u) === i);
      s.urls.splice(0, s.urls.length, ...nuevas);
    });
  })
  .catch(()=>{});

function shade(hex){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,r-40);g=Math.max(0,g-40);b=Math.max(0,b-10);
  return `rgb(${r},${g},${b})`;
}

/* ---------- estado visible ---------- */
function setState(txt, kind){           // kind: live | wait | bad | off
  pState.textContent = txt;
  pDot.className = 'dot' + (kind && kind!=='off' ? ' '+kind : '');
}
function setIcon(d, spinning){
  playIcon.querySelector('path').setAttribute('d', d);
  playIcon.classList.toggle('spin', !!spinning);
}
function markActive(paused){
  document.querySelectorAll('.station').forEach(el => {
    const on = current && el.dataset.id===current.id;
    el.classList.toggle('active', on);
    el.classList.toggle('paused', on && (paused || audio.paused));
  });
}
function touchProgress(){ lastTime = audio.currentTime; lastMoveAt = Date.now(); }

/* ---------- selección ---------- */
function select(s){
  if(current && current.id===s.id){ wantPlay && !userPaused ? pauseByUser() : resume(); return; }
  current = s;
  urlIdx = 0; attempt = 0;
  pName.textContent = s.name;
  pBadge.textContent = s.abbr;
  pBadge.style.background = `linear-gradient(135deg, ${s.color}, ${shade(s.color)})`;
  player.classList.add('show');
  updateMediaMeta(s);
  wantPlay = true; userPaused = false;
  startKeepAlive();          // debe iniciarse con el gesto del usuario
  connect();
}

function srcFor(url){
  // Anti-caché sólo a partir del 2º reintento: evita reutilizar una
  // conexión muerta, pero no molesta en el caso normal.
  if(attempt < 2) return url;
  return url + (url.includes('?') ? '&' : '?') + '_r=' + Date.now();
}

/* Reconexión completa: recarga la fuente desde cero. */
function connect(){
  if(!current) return;
  clearTimeout(retryTimer);
  wantPlay = true; userPaused = false;
  const url = current.urls[urlIdx] || current.urls[0];
  setState(attempt ? `Reconectando… (${attempt})` : 'Conectando…', 'wait');
  setIcon(ICON_LOAD, true);
  lastTime = -1; lastMoveAt = Date.now();
  audio.src = srcFor(url);
  audio.load();
  audio.play().catch(() => { if(wantPlay) scheduleRetry(); });
  markActive();
}

/* Reanudar sin tocar la conexión: es lo primero que se intenta siempre. */
function resume(){
  if(!current) return;
  wantPlay = true; userPaused = false;
  startKeepAlive();
  clearTimeout(retryTimer);
  if(!audio.src){ connect(); return; }
  setIcon(ICON_LOAD, true);
  lastMoveAt = Date.now();
  audio.play().catch(() => connect());
}

function pauseByUser(){
  userPaused = true; wantPlay = false;
  clearTimeout(retryTimer);
  audio.pause();                 // se mantiene la fuente: reanudar es instantáneo
  stopKeepAlive();
  setState('En pausa', 'off');
  setIcon(ICON_PLAY, false);
  markActive(true);
}

/* Reintento con espera creciente. Cambia de fuente tras varios fallos. */
function scheduleRetry(){
  if(!wantPlay || !current) return;
  clearTimeout(retryTimer);
  attempt++;
  if(attempt % 3 === 0 && current.urls.length > 1){
    urlIdx = (urlIdx + 1) % current.urls.length;   // probar otra fuente
  }
  const wait = Math.min(1200 * Math.pow(1.6, Math.min(attempt,6)), 15000);
  setState(attempt > 12 ? 'Emisora no disponible' : `Se cortó · reintento en ${Math.round(wait/1000)}s`, attempt > 12 ? 'bad' : 'wait');
  setIcon(ICON_LOAD, true);
  retryTimer = setTimeout(connect, wait);
}

playBtn.addEventListener('click', () => {
  if(!current) return;
  (wantPlay && !userPaused) ? pauseByUser() : resume();
});

/* ---------- eventos del elemento audio ---------- */
audio.addEventListener('playing', () => {
  attempt = 0; touchProgress();
  setState('En directo · reproduciendo', 'live');
  setIcon(ICON_PAUSE, false);
  markActive();
});
audio.addEventListener('timeupdate', touchProgress);
audio.addEventListener('waiting', () => { if(wantPlay && !userPaused){ setState('Cargando…','wait'); setIcon(ICON_LOAD,true);} });
audio.addEventListener('error',   () => { if(wantPlay && !userPaused) scheduleRetry(); });
audio.addEventListener('ended',   () => { if(wantPlay && !userPaused) scheduleRetry(); });
audio.addEventListener('pause',   () => {
  // NO se reconecta aquí: una pausa del sistema (llamada, notificación,
  // audio de otra app) es casi siempre temporal. El vigilante decide.
  if(userPaused) return;
  setIcon(ICON_PLAY, false);
  markActive(true);
});

/* ---------- vigilante (mide tiempo real, no ticks) ---------- */
setInterval(() => {
  if(!current || !wantPlay || userPaused) return;
  const idle = Date.now() - lastMoveAt;

  if(audio.paused){
    // Pausa que no ha pedido el usuario: primero reanudar, sin cortar nada.
    if(idle > RESUME_MS) resume();
    return;
  }
  if(audio.currentTime !== lastTime){ touchProgress(); return; }
  if(idle > STALL_MS) connect();      // congelado de verdad -> reconectar
}, 3000);

/* ---------- red ---------- */
window.addEventListener('online',  () => { if(wantPlay && !userPaused){ attempt = 0; connect(); } });
window.addEventListener('offline', () => { if(wantPlay && !userPaused) setState('Sin internet · esperando red','bad'); });
document.addEventListener('visibilitychange', () => {
  // Al volver a primer plano sólo se reanuda si estaba parado. Nunca se corta.
  if(document.visibilityState === 'visible' && wantPlay && !userPaused && audio.paused) resume();
});

/* ---------- volumen ---------- */
volEl.addEventListener('input', () => audio.volume = parseFloat(volEl.value));
audio.volume = parseFloat(volEl.value);

/* ---------- controles del sistema ---------- */
function updateMediaMeta(s){
  if(!('mediaSession' in navigator) || !s) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.name, artist: s.tag, album: 'VicRadio',
      artwork: [{ src:'icon-192.png', sizes:'192x192', type:'image/png' },
                { src:'icon-512.png', sizes:'512x512', type:'image/png' }]
    });
  }catch(e){}
}

if('mediaSession' in navigator){
  // playbackState se mantiene en 'playing' mientras reconectamos: así
  // Android conserva la notificación y no degrada el proceso.
  audio.addEventListener('playing', () => {
    updateMediaMeta(current);
    navigator.mediaSession.playbackState = 'playing';
  });
  audio.addEventListener('pause', () => {
    navigator.mediaSession.playbackState = userPaused ? 'paused' : 'playing';
  });
  navigator.mediaSession.setActionHandler('play',  () => resume());
  navigator.mediaSession.setActionHandler('pause', () => pauseByUser());
  navigator.mediaSession.setActionHandler('stop',  () => pauseByUser());
}

/* ---------- instalación PWA ---------- */
let deferred=null;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred=e; installBtn.classList.add('show'); });
installBtn.addEventListener('click', async () => {
  if(!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred=null; installBtn.classList.remove('show');
});
window.addEventListener('appinstalled', () => installBtn.classList.remove('show'));

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

const hint=document.getElementById('hint');
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
hint.textContent = isIOS
  ? 'Para instalar en iPhone: pulsa Compartir y "Añadir a pantalla de inicio". Si se corta, la app se reconecta sola.'
  : 'Consejo: usa "Instalar app" o el menú del navegador para añadirla a la pantalla de inicio. Si se corta, la app se reconecta sola.';
</script>
<script>
// ===== Novedades (salen una sola vez en cada dispositivo) =====
(function(){
  var ID='2026-10-17', K='novedades-vicradio', ITEMS=["📻 <b>COPE Granada</b> vuelve a sonar: había cambiado la dirección de su emisión y ya está puesta la nueva."];
  function ver(){ try{ if(localStorage.getItem(K)===ID) return; }catch(e){ return; }
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:99999;padding:18px;font-family:inherit';
    d.innerHTML='<div role="dialog" aria-modal="true" style="background:#fff;border-radius:16px;max-width:420px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);color:#1e293b">'+
      '<div style="font-size:1.2rem;font-weight:800;margin-bottom:10px">✨ Novedades</div>'+
      '<ul style="margin:0 0 16px;padding-left:20px;line-height:1.5;font-size:.95rem">'+ITEMS.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>'+
      '<button type="button" style="width:100%;background:#2563eb;color:#fff;border:0;border-radius:10px;padding:12px;font-size:1rem;font-weight:700;cursor:pointer">¡Entendido!</button></div>';
    function cerrar(){ try{ localStorage.setItem(K,ID); }catch(e){} d.remove(); }
    d.querySelector('button').onclick=cerrar; d.addEventListener('click',function(e){ if(e.target===d) cerrar(); });
    document.body.appendChild(d);
  }
  if(document.readyState==='complete') setTimeout(ver,600); else window.addEventListener('load',function(){ setTimeout(ver,600); });
})();
</script>
